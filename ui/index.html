<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>@mops</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--tx:#12141a;--mu:#5c6570;--line:#e4e8ee;--ac:#1d4ed8;--ok:#047857;--warn:#b45309}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,select,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}a{color:inherit}
.app{max-width:760px;margin:0 auto;padding:28px 20px 72px}
header{display:flex;align-items:center;gap:22px;margin-bottom:40px}
.logo{font-weight:720;letter-spacing:-.04em;font-size:20px;text-decoration:none}
nav{display:flex;gap:16px}nav a{color:var(--mu);text-decoration:none;font-size:15px}nav a.on{color:var(--tx);font-weight:680}
.eng{margin-left:auto;font-size:13px;color:var(--mu);text-decoration:none}
h1{font-size:46px;line-height:1.05;letter-spacing:-.045em;font-weight:650;margin:0}
.did{font-size:18px;color:#2c3340;margin:12px 0 28px;max-width:38em}
.ask{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:6px 6px 6px 18px;display:flex;gap:8px;align-items:flex-end;box-shadow:0 12px 40px #12141a0d}
.ask textarea{flex:1;border:0;resize:none;outline:0;font-size:18px;line-height:1.4;padding:14px 0;min-height:56px;background:transparent}
.ask textarea::placeholder{color:#98a0ab}
.send{background:var(--ac);color:#fff;border-radius:14px;padding:12px 16px;font-weight:680;margin-bottom:6px}
.send:disabled{opacity:.45}
.starts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 8px}
.starts button{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:14px;color:#1f2937}
.starts button:hover{border-color:#c9d2de}
.note{color:var(--mu);font-size:15px;margin:8px 2px 0}
.sec{margin-top:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin:0 0 12px;box-shadow:0 8px 28px #12141a08}
.card h2{font-size:22px;letter-spacing:-.03em;margin:0 0 6px;font-weight:650}
.card .meta{color:var(--mu);font-size:14px;margin:0 0 12px}
.card p{margin:0 0 12px}
.bits{margin:0 0 14px;padding:0;list-style:none}
.bits li{padding:8px 0;border-top:1px solid var(--line);font-size:16px}
.bits li:first-child{border-top:0}
.bits b{font-weight:650}
.bits span{color:var(--mu);display:block;font-size:13px}
.field{display:block;margin:8px 0;font-size:13px;color:var(--mu)}
.field input{display:block;width:100%;margin-top:4px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;color:var(--tx);background:#fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.approve{background:var(--ac);color:#fff;border-radius:12px;padding:11px 18px;font-weight:680}
.approve:disabled{opacity:.5}
.edit{color:var(--ac);font-weight:650;padding:11px 12px}
.bar{height:6px;background:#e7ebf0;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px;width:0}
.ids{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.ids div{background:#f6f8fb;border-radius:12px;padding:10px 12px}
.ids b{display:block;font-size:14px;word-break:break-all}
.ids span{color:var(--mu);font-size:12px}
.ok{color:var(--ok);font-weight:650}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 18px}
.filters select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.count{color:var(--mu);font-size:14px}
.grp{margin:0 0 18px}
.grp h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:18px 4px 8px;font-weight:680}
.sheet{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.camp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:left;padding:14px 16px;border-top:1px solid #f0f2f5}
.sheet .camp:first-child{border-top:0}
.camp:hover{background:#f8fafc}
.camp .nm{font-weight:620}
.camp .sub{color:var(--mu);font-size:13px}
.st{font-size:13px;font-weight:680;color:var(--ac)}
.st.wait{color:var(--warn)}
.st.bad{color:var(--warn)}
.camp .bar{grid-column:1/-1;margin-top:6px}
.back{color:var(--ac);font-weight:650;font-size:14px;text-decoration:none}
.hist{margin-top:36px;color:var(--mu)}
.hist summary{cursor:pointer;font-size:14px}
.hist button{display:block;width:100%;text-align:left;padding:10px 0;border-top:1px solid var(--line);color:var(--tx);font-size:15px}
.bub{margin:10px 0;max-width:40em}
.bub.me{margin-left:auto;background:#1d4ed8;color:#fff;border-radius:16px 16px 4px 16px;padding:10px 14px;width:fit-content}
.bub.bot{color:#243040}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#12141a;color:#fff;border-radius:999px;padding:10px 16px;font-size:14px;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
.empty{color:var(--mu);padding:8px 0 24px}
@media(max-width:640px){h1{font-size:34px}.app{padding:18px 14px 48px}header{gap:12px;margin-bottom:28px}.ids{grid-template-columns:1fr}}
</style></head><body>
<div class="app">
<header>
  <a class="logo" href="#/">@mops</a>
  <nav aria-label="Primary"><a href="#/" id="navHome">Home</a><a href="#campaigns" id="navCamps">My campaigns</a></nav>
  <a class="eng" href="/engine">Engine room</a>
</header>
<main id="main"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(+n||0).toLocaleString('en-US');
let S,D,TH={},PF=null,PFALL=null,BR=null,LC=[],DONE=null,MINE=null,busy=false,showCovered=false,editing=null,FILT={region:'all',program:'all',quarter:'all'},delegated=false,answer='';
const STAGES=['Budget','Setup','Invite','Engagement','Leads','SFDC sync','Opps','Attribution','Report'];
function route(){const h=location.hash.replace(/^#/,'').replace(/^\//,'');if(h==='campaigns'||h==='quarter')return{view:'campaigns'};if(h.startsWith('c/'))return{view:'card',id:h.slice(2)};if(h.startsWith('t/'))return{view:'thread',id:h.slice(2)};if(h.startsWith('LC-'))return{view:'lc',id:h};return{view:'home'}}
function toast(t){const x=$('toast');x.textContent=t;x.classList.add('on');clearTimeout(x._t);x._t=setTimeout(()=>x.classList.remove('on'),2400)}
function handledCount(){let n=0;for(const t of Object.values(TH))for(const m of t.messages||[])if(m.who==='@mops')for(const a of m.artifacts||[])if(!a.error&&a.kind!=='Recommendation')n+=a.kind==='Autopilot'?(a.data?.auto||0):1;return n}
function coveredLines(){const o=[];for(const t of Object.values(TH))for(const m of t.messages||[])if(m.who==='@mops')for(const a of m.artifacts||[])if(!a.error&&a.title)o.push(String(a.title).replace(/^[A-Z]+-\d+:\s*/,''));return [...new Set(o)].slice(0,5)}
function didLine(){const n=handledCount();const b=BR;let s=n?`I handled ${n} thing${n===1?'':'s'} today.`:'I checked the book this morning.';
 if(b&&b.name&&!['approved','live'].includes(String(b.status||''))&&b.gap>0)s+=` I drafted ${b.name} because ${b.geo} ${b.program} is ${money(b.gap)} behind its goal.`;
 else if(DONE&&DONE.fields)s+=` ${DONE.fields.campaign_name} is covered.`;
 return s}
function statusOf(c){if(c.needsApproval)return{t:'Waiting on you',c:'wait'};if(c.pace==='behind')return{t:'Behind',c:'bad'};if(c.status==='Live'||c.stage==='Run')return{t:'Running',c:''};if(c.stage==='Report')return{t:'Wrapped up',c:''};return{t:'On track',c:''}}
function pctOf(c){let i=STAGES.indexOf(c.stage||'');if(c.status==='Live'||c.stage==='Run')i=6;if(i<0)i=3;return Math.round((i+1)/STAGES.length*100)}
function guesses(lc){const f=lc.fields||{};return{venue:f.venue||((f.city||'City')+' — Main Tower'),cost_center:f.cost_center||'CC-4408',client_pm:f.client_pm||f.owner||'Srisha R.',agency_pm:f.agency_pm||'Ada Klein',agency_confirm:f.vendor||(f.country==='Germany'?'Rhine & Co Events':'the agency on the roster')}}
function bitsFor(lc){const f=lc.fields||{},g=guesses(lc),over=!!(lc.budget&&lc.budget.total>150000);
 const bits=[{key:'venue',label:'Venue',value:g.venue,note:'I guessed this from the city.'},{key:'signer',label:'Who signs',value:over?'Chris M.':'Srisha R.',note:over?'Over $150,000, so Chris M. approves.':'Under $150,000, so you can sign this.'}];
 if(!f.vendor)bits.push({key:'agency_confirm',label:'Agency',value:g.agency_confirm,note:'From the agency roster.'});
 else bits.push({key:'agency_pm',label:'Agency contact',value:g.agency_pm,note:'Who sends the SOW back.'});
 return{g,over,bits:bits.slice(0,3)}}
function needsCards(){const out=[];
 for(const lc of LC){if(!lc||lc.error)continue;if(MINE&&lc.id!==MINE&&lc.id!=='LC-DEMO')continue;if(!['intake','budget','sow'].includes(lc.step))continue;if(DONE&&DONE.id===lc.id)continue;out.push({kind:'lc',lc})}
 const book=PFALL||PF;const behind=(book?.groups?Object.values(book.groups).flat():(D?.campaigns||[])).filter(c=>c.pace==='behind');
 const code=behind.find(c=>/code/i.test(c.nextAction||''));
 if(code)out.push({kind:'code',c:code,n:behind.length});
 const ev=(D?.events||[]).filter(e=>e.capacity&&(e.registrations||0)/e.capacity<0.5).sort((a,b)=>(a.registrations/a.capacity)-(b.registrations/b.capacity))[0];
 if(ev)out.push({kind:'regs',ev,n:(D.events||[]).filter(e=>e.capacity&&(e.registrations||0)/e.capacity<0.5).length});
 return out.slice(0,3)}
function askBox(){return `<form class="ask" id="askForm"><label class="sr" for="ask" style="position:absolute;left:-999px">Ask @mops</label><textarea id="ask" rows="1" placeholder="Singapore CISO roundtable, Feb, $40K, agency X"></textarea><button class="send" id="send" type="submit">Send</button></form>
<div class="starts"><button type="button" data-q="Singapore CISO roundtable, Feb, $40K, agency X">Singapore CISO roundtable, Feb, $40K</button><button type="button" data-q="Which campaigns are behind?">Which campaigns are behind?</button><button type="button" data-q="What did you cover for me?">What did you cover for me?</button></div>${answer?`<p class="note">${esc(answer)}</p>`:''}`}
function cardLc(lc){const f=lc.fields||{},b=lc.budget||{},{bits}=bitsFor(lc);const edit=editing===lc.id;
 const when=[f.city,f.start_date,b.total?money(b.total):''].filter(Boolean).join(' · ');
 const body=edit?bits.map(x=>`<label class="field">${esc(x.label)}<input data-bit="${esc(x.key)}" value="${esc(x.value)}"></label>`).join(''):`<ul class="bits">${bits.map(x=>`<li><b>${esc(x.label)}</b> ${esc(x.value)}<span>${esc(x.note)}</span></li>`).join('')}</ul>`;
 return `<article class="card" data-lc="${esc(lc.id)}"><h2>${esc(f.campaign_name||'New campaign')}</h2><p class="meta">${esc(when)}</p><p>I filled the budget. Approve, and I send the SOW and create the IDs. ${bits.length===1?'One thing is yours.':bits.length+' things are yours.'}</p>${body}<div class="row"><button class="approve" type="button" data-approve="${esc(lc.id)}">Approve</button><button class="edit" type="button" data-edit="${esc(lc.id)}">${edit?'Close':'Edit'}</button></div></article>`}
function cardDone(r){const f=r.fields||{},c=r.codes||{},chk=r.sow&&r.sow.selfCheck;
 return `<article class="card"><p class="ok">Covered for you</p><h2>${esc(f.campaign_name||'Campaign')}</h2><p>SOW sent. IDs created.${r.step==='run'||r.step==='report'?' It is live.':''}</p><div class="bar"><i style="width:${r.step==='run'||r.step==='report'?'100':'72'}%"></i></div><div class="ids"><div><b>${esc(c.ban_id||'—')}</b><span>BAN / cost center ${esc(c.cc_id||'')}</span></div><div><b>${esc(c.campaign_code||'—')}</b><span>Campaign code</span></div><div><b>${esc(c.sfdc_campaign_id||'—')}</b><span>SFDC campaign</span></div><div><b>${esc(c.event_id||'—')}</b><span>Event</span></div></div>${chk?`<p>${esc(chk.caught)}. ${esc(chk.fix)}.</p>`:''}<a class="back" href="${r.campaign&&r.campaign.id?'#c/'+esc(r.campaign.id):'#campaigns'}">See it in my campaigns</a></article>`}
function cardCode(x){return `<article class="card"><h2>${esc(x.c.name)}</h2><p>${x.n} campaign${x.n===1?' is':'s are'} behind. This one is missing its campaign code. I drafted the code.</p><div class="row"><button class="approve" type="button" data-code="${esc(x.c.id)}">Approve</button></div></article>`}
function cardRegs(x){const e=x.ev;return `<article class="card"><h2>${esc(e.name)}</h2><p>${x.n} event${x.n===1?' is':'s are'} under half full. This one has ${e.registrations||0} of ${e.capacity}. I drafted a reminder to the opted-in list.</p><div class="row"><button class="approve" type="button" data-regs="${esc(e.campaignId||'')}">Approve</button></div></article>`}
function home(){const cards=needsCards();
 let h=`<h1>Hey, Srisha.</h1><p class="did">${esc(didLine())}</p>${askBox()}<div class="sec" id="actions">`;
 if(DONE)h+=cardDone(DONE);
 if(!cards.length&&!DONE){const lines=coveredLines();h+=`<article class="card"><h2>You're all caught up.</h2><p>Here's what I handled.</p>${lines.length?`<ul class="bits">${lines.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p class="meta">Nothing needed a decision.</p>'}</article>`}
 else h+=cards.map(c=>c.kind==='lc'?cardLc(c.lc):c.kind==='code'?cardCode(c):cardRegs(c)).join('');
 if(showCovered){const lines=coveredLines();h+=`<article class="card"><h2>Here's what I handled.</h2>${lines.length?`<ul class="bits">${lines.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p>Nothing has landed in the book yet.</p>'}</article>`}
 const threads=(S?.threads||[]).slice(0,8);
 h+=`<details class="hist"><summary>Earlier asks</summary>${threads.map(t=>`<button type="button" data-thread="${esc(t.id)}">${esc(t.title)}</button>`).join('')||'<p>None yet.</p>'}</details></div>`;
 return h}
function campaigns(){const groups=PF?.groups||{};const order=['ABM','Digital','Events','Partner','Lead gen'];const regs=['all','APJ','EMEA','Americas'];const progs=['all',...order];
 let n=0,body='';
 for(const geo of ['APJ','EMEA','Americas']){let block='';
  for(const name of order){const rows=(groups[name]||[]).filter(c=>(c.geo||'')===geo);if(!rows.length)continue;n+=rows.length;
   block+=`<h3>${esc(geo)} · ${esc(name)}</h3><div class="sheet">${rows.map(c=>{const st=statusOf(c);return `<button class="camp" type="button" data-camp="${esc(c.id)}"><span class="nm">${esc(c.name)}<div class="sub">${esc(c.country||c.region||'')}</div></span><span class="st ${st.c}">${esc(st.t)}</span><span class="bar"><i style="width:${pctOf(c)}%"></i></span></button>`}).join('')}</div>`}
  body+=block}
 if(!n)body=`<p class="empty">Nothing in this slice.</p>`;
 return `<h1>My campaigns</h1><div class="filters"><select id="fRegion">${regs.map(v=>`<option value="${v}" ${FILT.region===v?'selected':''}>${v==='all'?'All regions':v}</option>`).join('')}</select><select id="fProgram">${progs.map(v=>`<option value="${v}" ${FILT.program===v?'selected':''}>${v==='all'?'All programs':v}</option>`).join('')}</select><span class="count">${n} campaign${n===1?'':'s'}</span></div>${body}`}
function cardView(id){const c=(D?.campaigns||[]).find(x=>x.id===id);if(!c)return `<p class="empty">That campaign is not in the book.</p><a class="back" href="#campaigns">My campaigns</a>`;const st=statusOf(c);
 return `<p><a class="back" href="#campaigns">My campaigns</a></p><article class="card"><h2>${esc(c.name)}</h2><p class="meta">${esc(c.geo||'')} · ${esc(c.program||c.channel||'')} · ${esc(st.t)}</p><div class="bar"><i style="width:${pctOf(c)}%"></i></div><p class="ok">Covered for you</p><p>${esc(c.nextAction||'Running inside the rules.')}</p><div class="ids"><div><b>${esc(c.code||'—')}</b><span>Campaign code</span></div><div><b>${esc(c.sfdcId||'—')}</b><span>SFDC campaign</span></div><div><b>${money(c.spend||0)}</b><span>of ${money(c.budget||0)} budget</span></div><div><b>${money(c.pipeline||0)}</b><span>pipeline of ${money(c.goal||0)}</span></div></div></article>`}
function threadView(id){const t=TH[id];if(!t)return `<p class="empty">That ask is not here.</p><a class="back" href="#/">Home</a>`;
 const msgs=(t.messages||[]).slice(-12).map(m=>`<div class="bub ${m.who==='@mops'?'bot':'me'}">${esc(m.text||'')}</div>`).join('');
 return `<p><a class="back" href="#/">Home</a></p><h1>${esc(t.title)}</h1>${msgs||'<p class="empty">No messages yet.</p>'}`}
function lcView(id){const lc=LC.find(x=>x.id===id)||(DONE&&DONE.id===id?DONE:null);if(!lc)return `<p class="empty">Opening…</p>`;if(DONE&&DONE.id===id)return cardDone(DONE);if(['intake','budget','sow'].includes(lc.step))return cardLc(lc);if(lc.codes)return cardDone(lc);return `<article class="card"><h2>${esc(lc.fields?.campaign_name||id)}</h2><p>${esc((lc.did||[])[0]||'In progress.')}</p></article>`}
function render(){const r=route();$('navHome').classList.toggle('on',r.view==='home');$('navCamps').classList.toggle('on',r.view!=='home'&&r.view!=='thread');
 $('main').innerHTML=r.view==='home'?home():r.view==='campaigns'?campaigns():r.view==='card'?cardView(r.id):r.view==='thread'?threadView(r.id):lcView(r.id);
 bind()}
function bind(){const form=$('askForm');if(form){form.onsubmit=ev=>{ev.preventDefault();ask($('ask').value)};[...document.querySelectorAll('.starts button')].forEach(b=>b.onclick=()=>ask(b.dataset.q))}
 document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>approveLc(b.dataset.approve));
 document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=editing===b.dataset.edit?null:b.dataset.edit;render()});
 document.querySelectorAll('[data-code]').forEach(b=>b.onclick=()=>approveFix(b.dataset.code,'@mops create a campaign code'));
 document.querySelectorAll('[data-regs]').forEach(b=>b.onclick=()=>approveFix(b.dataset.regs,'@mops segment opted-in contacts and email them about a reminder, send'));
 document.querySelectorAll('[data-camp]').forEach(b=>b.onclick=()=>go('c/'+b.dataset.camp));
 document.querySelectorAll('[data-thread]').forEach(b=>b.onclick=()=>go('t/'+b.dataset.thread));
 const fr=$('fRegion'),fp=$('fProgram');if(fr)fr.onchange=()=>setFilt('region',fr.value);if(fp)fp.onchange=()=>setFilt('program',fp.value)}
async function setFilt(k,v){FILT[k]=v;await loadPortfolio();render()}
async function loadPortfolio(){const q=new URLSearchParams(FILT);try{PF=await(await fetch('/api/portfolio?'+q)).json()}catch(_){PF=PF}try{PFALL=await(await fetch('/api/portfolio?region=all&program=all&quarter=all')).json()}catch(_){PFALL=PFALL}}
async function go(id){history.replaceState(null,'',id==='home'||id==='/'?'#/':'#'+id);if(String(id).startsWith('LC-')){try{const row=await(await fetch('/api/engine/lifecycle/'+encodeURIComponent(id))).json();const i=LC.findIndex(x=>x.id===id);if(i>=0)LC[i]=row;else LC.push(row)}catch(_){}}render();scrollTo(0,0)}
async function load(){if(!delegated){delegated=true;try{await fetch('/api/delegate',{method:'POST'})}catch(_){}}
 S=await(await fetch('/api/state')).json();D=await(await fetch('/api/data')).json();
 try{BR=await(await fetch('/api/briefing')).json()}catch(_){}
 await loadPortfolio();
 const ts=await Promise.all((S.threads||[]).map(t=>fetch('/api/thread/'+t.id).then(r=>r.json()).catch(()=>null)));TH={};ts.filter(Boolean).forEach(t=>{if(t.id)TH[t.id]=t});
 let pack=null;try{pack=await(await fetch('/api/engine/lifecycle')).json()}catch(_){}
 const ids=[...new Set(['LC-DEMO',MINE].filter(Boolean))];
 LC=(await Promise.all(ids.map(id=>fetch('/api/engine/lifecycle/'+id).then(r=>r.json()).catch(()=>null)))).filter(x=>x&&x.id);
 if(pack&&!LC.length&&pack.draft)LC=[pack.draft];
 const a=document.activeElement;if(busy)return;if(a&&(a.id==='ask'||a.dataset&&a.dataset.bit))return;render()}
function readBits(id){const root=document.querySelector(`[data-lc="${id}"]`);const o={};if(!root)return o;root.querySelectorAll('[data-bit]').forEach(el=>{if(String(el.value).trim())o[el.dataset.bit]=el.value.trim()});return o}
async function postLc(id,action,patch){const res=await fetch('/api/engine/lifecycle/'+encodeURIComponent(id),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action,patch:patch||{}})});const r=await res.json();if(!res.ok|| (r.error&&!r.step))throw new Error(r.error||'Could not do that');return r}
async function approveLc(id){if(busy)return;const typed=readBits(id);const lc=LC.find(x=>x.id===id)||{};const g={...guesses(lc),...typed};if(typed.agency_confirm)g.agency_confirm=typed.agency_confirm;
 busy=true;const btn=document.querySelector(`[data-approve="${id}"]`);if(btn){btn.disabled=true;btn.textContent='Working…'}
 try{let r=await postLc(id,'answer',{fields:{venue:g.venue,cost_center:g.cost_center,client_pm:g.client_pm,agency_pm:g.agency_pm,vendor:g.agency_confirm}});
