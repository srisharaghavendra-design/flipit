function mkChart(cv,c){const st=getComputedStyle(document.documentElement),ac=st.getPropertyValue('--ac').trim(),a2=st.getPropertyValue('--ac2').trim(),mu=st.getPropertyValue('--mu').trim(),ln=st.getPropertyValue('--line').trim();const pal=[ac,a2,'#ffb35c','#5cb8ff','#ff5c7a','#c77dff'];
 const ds=c.datasets.map((d,i)=>({...d,backgroundColor:c.type==='doughnut'?pal:pal[i],borderColor:pal[i],borderRadius:6,tension:.35,pointRadius:2}));
 return new Chart(cv,{type:c.type,data:{labels:c.labels,datasets:ds},options:{animation:{duration:700},plugins:{legend:{labels:{color:mu,boxWidth:10}}},scales:c.type==='doughnut'?{}:{x:{ticks:{color:mu},grid:{display:false}},y:{ticks:{color:mu},grid:{color:ln}},...(c.datasets.some(d=>d.yAxisID)?{y1:{position:'right',ticks:{color:mu},grid:{display:false}}}:{})}}});}

function target(){if(cur!=='all')return cur;const q=$('tx').value.toLowerCase();const hit=Object.values(TH).find(t=>short(t.title).toLowerCase().split(/\s+/).some(w=>w.length>4&&q.includes(w)));return hit?hit.id:'T-K5';}
function sugg(){const t=TH[target()];const c=D.campaigns.find(c=>'T-'+c.id===t.id);let s;
 if(t.type==='account')s=[`who's hot at ${short(t.title)}?`,"why didn't these leads reach SFDC?",'credit the roundtable on this opp','pipeline by account'];
 else{s=[];if(c&&!c.code)s.push('create a campaign code');s.push('what\'s next?');if(c&&c.channel==='Events')s.push('set up the event for 40 guests','who registered?');if(c&&c.channel==='Partner')s.push('MDF status');s.push('pipeline by channel','push the target list to sellers','budget request $60K','email opted-in CIOs in '+(c?c.region:'India')+' about SASE');}
 $('sug').innerHTML=s.slice(0,6).map(x=>`<button>${e(x)}</button>`).join('');[...$('sug').children].forEach((b,i)=>b.onclick=()=>{$('tx').value='@mops '+s[i];$('tx').focus();});}
function go(id){$('listen').classList.remove('on');cur=id;history.replaceState(null,'',id==='all'?'#':'#'+id);render()}
function openArt(k){const a=ARTS[k];const tb=t=>t&&t.rows.length?`<div class="list">${t.rows.map(r=>`<div class="li"><b>${e(r[0])}</b> <span>${r.slice(1).map(e).join(' · ')}</span></div>`).join('')}</div>`:'';
 $('sheetBody').innerHTML=`<div class="kk">${e(a.kind||'Error')}</div><h2>${e(a.error||a.title)}</h2>${a.chart?'<div class="list" style="padding:12px"><canvas id="sc"></canvas></div>':''}${a.body?`<pre>${e(a.body)}</pre>`:''}${tb(a.table)}${a.table2&&a.table2.rows.length?'<div class="kk" style="color:var(--warn);margin-bottom:6px">Exceptions</div>'+tb(a.table2):''}
 ${a.cites?`<div class="cites">Sources ${a.cites.slice(0,30).map(c=>`<span>${e(c)}</span>`).join('')}</div>`:''}<div class="acts2">${(a.actions||[]).map(x=>x.api?`<button class="${/Reject/.test(x.label)?'b2':'b1'}" onclick="closeSheet();api('${x.api}')">${e(x.label)}</button>`:`<button class="b1" onclick="closeSheet();say('${e(x.say)}')">${e(x.label)}</button>`).join('')}${[a.link,a.link2].filter(Boolean).map(l=>`<a class="b2" style="text-decoration:none" target="_blank" href="${l.href}">${e(l.label)}</a>`).join('')}</div>`;
 $('sheet').classList.add('on');$('scrim').classList.add('on');if(a.chart)setTimeout(()=>charts.push(mkChart($('sc'),a.chart)),50);}
function closeSheet(){$('sheet').classList.remove('on');$('scrim').classList.remove('on')}$('scrim').onclick=closeSheet;document.onkeydown=ev=>{if(ev.key==='Escape')closeSheet()};
function snooze(id){snoozed.add(id);localStorage.mopsSnooze=JSON.stringify([...snoozed]);resolve(id).then(render)}
function resolve(id){const n=document.querySelector(`.dc[data-id="${id}"]`);if(n&&n.classList.contains('gone'))return Promise.resolve();if(!n)return Promise.resolve();n.classList.add('gone');return new Promise(r=>setTimeout(r,450))}
function edit(tid,st,id){go(tid);$('tx').value=st==='budget'?'@mops budget request $':st==='shift'?'@mops ':'@mops ';$('tx').focus()}
const STEPS=[[/budget/,['Reading the thread','Pulling spend and pipeline','Checking your $150K limit','Drafting the request']],[/segment|email|invite|nurture/,['Reading the thread','Building the segment','Checking consent','Drafting and sending']],[/pipeline|report|how|which|chart/,['Querying the data layer','Computing totals','Citing source records','Drawing the chart']],[/sfdc|sync/,['Reading the sync log','Grouping failure causes','Fixing what is safe']],[/hot|score/,['Reading 6sense intent','Adding Adobe web visits','Scoring contacts']],[/upload|csv|list/,['Parsing the file','De-duplicating','Matching to accounts','Flagging exceptions']],[/./,['Reading the thread','Choosing the right agent','Doing the work']]];
async function think(text){const st=STEPS.find(s=>s[0].test(text.toLowerCase()))[1];const el=document.createElement('div');el.className='think glass';el.id='thinking';el.innerHTML=`<div class="shimmer">@mops is working…</div>`;$('msgs').appendChild(el);
 for(const s of st){const r=document.createElement('div');r.className='row';r.innerHTML=`<i></i>${s}`;el.appendChild(r);$('msgs').scrollTop=1e9;await new Promise(z=>setTimeout(z,260));el.querySelectorAll('.row').forEach((x,i,arr)=>{if(i<arr.length-1)x.classList.add('done')});}}
async function send(csv){let text=$('tx').value.trim()||(csv?'@mops upload this attendee list':'');if(!text||busy)return;if(!/@mops/i.test(text))text='@mops '+text;const tid=target();
 if(cur==='all'&&tid)go(tid);busy=true;$('send').disabled=true;setState('working');$('tx').value='';
 const u=document.createElement('div');u.className='u';u.innerHTML=`<div>${e(text)}</div>`;$('msgs').appendChild(u);
 const w=think(text);const r=fetch('/api/post',{method:'POST',body:JSON.stringify({threadId:tid,text,csv})});await Promise.all([w,r]);
 busy=false;$('send').disabled=false;refreshState();await load();}
async function say(t,tid,id){if(id)await resolve(id);if(tid&&cur!==tid&&cur!=='all')go(tid);if(tid&&cur==='all'){busy=true;await fetch('/api/post',{method:'POST',body:JSON.stringify({threadId:tid,text:t})});busy=false;return load()}$('tx').value=t;send()}
async function api(u,id){if(id)await resolve(id);await fetch(u,{method:'POST'});load()}
$('send').onclick=()=>send();$('tx').onkeydown=ev=>{if(ev.key==='Enter'&&!ev.shiftKey){ev.preventDefault();send()}};$('tx').oninput=()=>{$('to').innerHTML=`To <b>${e(short(TH[target()].title))}</b>`;};
$('csv').onchange=async ev=>{const f=ev.target.files[0];if(f){send(await f.text());ev.target.value=''}};
$('theme').innerHTML=ic('theme');$('more').innerHTML=ic('more');$('att').insertAdjacentHTML('afterbegin',ic('plus'));$('send').innerHTML=ic('up');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)$('mic').title='Voice not supported in this browser';
const stopL=()=>{$('listen').classList.remove('on');refreshState()};let REC=null;$('listen').onclick=()=>{if(REC)REC.stop();stopL()};
$('mic').onclick=()=>{$('heard').textContent='Listening…';$('listen').classList.add('on');setState('working');if(navigator.vibrate)navigator.vibrate(8);
 if(!SR){$('heard').textContent='Voice needs Chrome or Safari. Type below instead.';setTimeout(stopL,1800);return}
 const r=REC=new SR();r.lang='en-IN';r.interimResults=true;r.onresult=ev=>{const t=[...ev.results].map(x=>x[0].transcript).join('');$('heard').textContent=t;$('tx').value=t};
 r.onerror=ev=>{$('heard').textContent=ev.error==='not-allowed'?'Mic permission is off.':'I didn\'t catch that.';setTimeout(stopL,1400)};r.onend=()=>{REC=null;if($('tx').value){stopL();send()}else setTimeout(stopL,1200)};try{r.start()}catch(_){stopL()}clearTimeout(window._lt);window._lt=setTimeout(()=>{if(REC)REC.stop();stopL()},9000)};
$('more').onclick=()=>{$('sheetBody').innerHTML=`<div class="kk">Under the hood</div><h2>Everything @mops runs on</h2><div class="list menu"><div class="li" data-t="stack" onclick="panel('stack')"><b>Tools it replaced</b> <span>Eloqua, Power BI, Cvent…</span></div><div class="li" data-t="data" onclick="panel('data')"><b>Data layer</b> <span>one store, live counts</span></div><div class="li" data-t="outbox" onclick="panel('outbox')"><b>Outbox</b> <span>emails sent</span></div><div class="li" onclick="reset()"><b>Reset demo data</b></div></div><div class="cites">${S.mode==='llm'?'AI mode · '+e(S.model):'Rule mode · add an AI key for full reasoning'}</div><div id="panel"></div>`;$('sheet').classList.add('on');$('scrim').classList.add('on')};
async function panel(t){const P=$('panel');if(t==='stack')P.innerHTML=`<div class="list">${S.stack.map(s=>`<div class="li"><b>${e(s[0])}</b> → ${e(s[1])}<br><span>${e(s[2])}</span></div>`).join('')}</div>`;
 if(t==='data'){const c=S.counts;P.innerHTML=`<div class="list">${Object.entries(c).map(([k,v])=>`<div class="li"><b>${v}</b> <span>${k}</span></div>`).join('')}</div><button class="b2" onclick="fetch('/api/nurture/run',{method:'POST'}).then(load)">Fast-forward nurture</button>`;}
 if(t==='outbox'){const o=await(await fetch('/api/outbox')).json();P.innerHTML=`<div class="list">${o.slice(0,50).map(m=>`<div class="li"><a style="color:var(--ac)" target="_blank" href="/outbox/${m.id}">${e(m.subject)}</a><br><span>${e(m.to)}${m.opened?' · opened':''}</span></div>`).join('')||'<div class="li">No emails yet</div>'}</div>`;}}
async function reset(){if(confirm('Reset all demo data?')){await fetch('/api/reset',{method:'POST'});closeSheet();load()}}
window.onhashchange=()=>{const h=location.hash.startsWith('#T-')?location.hash.slice(1):'all';if(h!==cur&&TH[h]||h==='all'&&cur!=='all'){cur=h;render()}};
if(innerWidth<600)$('tx').placeholder='Ask @mops anything…';load();setInterval(()=>{if(!busy&&!$('sheet').classList.contains('on'))load()},30000);
</script></body></html>
