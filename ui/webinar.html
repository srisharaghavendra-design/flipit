<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Lead generation · __BRAND__</title>
<style>
:root {
  --bg: #f3f2ef;
  --card: #fff;
  --ink: #1c1b19;
  --muted: #5e5a53;
  --line: #e4dfd6;
  --accent: #0f6e56;
  --accent-soft: #e7f4ef;
  --hot: #0f6e56;
  --warm: #8a5a12;
  --cold: #5e5a53;
  --shadow: 0 1px 2px rgba(28, 27, 25, .04), 0 18px 40px rgba(28, 27, 25, .06);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 21px/1.45 ui-sans-serif, system-ui, "Segoe UI", sans-serif; min-height: 100vh; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, p { margin: 0; }
header {
  position: sticky; top: 0; z-index: 5;
  display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px;
  padding: 16px 28px;
  background: rgba(243, 242, 239, .94);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.logo { color: var(--ink); text-decoration: none; font-weight: 720; letter-spacing: -.03em; font-size: 22px; }
.logo i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); margin-right: 8px; }
.product { font-size: 18px; color: var(--muted); }
.steps { display: flex; gap: 8px; list-style: none; margin: 0; padding: 0; flex: 1; }
.steps button {
  border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: 8px 14px; font-size: 16px; font-weight: 650;
}
.steps button[aria-current="step"] { background: var(--accent); color: #fff; border-color: var(--accent); }
.steps button:disabled { opacity: .45; cursor: default; }
#replay, #next, .dl, .filebtn {
  border: 0; border-radius: 999px; background: var(--accent); color: #fff;
  font-weight: 700; padding: 12px 18px;
}
#replay { background: #1c1b19; }
#replay.on { background: var(--warm); }
main { width: min(1180px, calc(100% - 36px)); margin: 0 auto; padding: 22px 0 140px; }
.kicker { font-size: 14px; letter-spacing: .14em; text-transform: uppercase; font-weight: 750; color: var(--muted); margin-bottom: 8px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.split section { background: var(--card); border-radius: 22px; padding: 16px 20px; box-shadow: var(--shadow); }
.split .you { box-shadow: inset 6px 0 0 #3d3a34, var(--shadow); }
.split .agent { box-shadow: inset 6px 0 0 var(--accent), var(--shadow); }
.did { font-size: 26px; line-height: 1.25; letter-spacing: -.03em; font-weight: 650; }
.why { margin-top: 16px; background: #fff; border-radius: 18px; padding: 16px 20px; font-size: 20px; }
.why b { color: var(--accent); }
.src { display: block; margin-top: 8px; color: var(--muted); font-size: 17px; }
details { margin-top: 12px; background: #fff; border-radius: 16px; padding: 12px 18px; }
summary { font-size: 18px; font-weight: 700; cursor: pointer; }
details ol { margin: 10px 0 4px; padding-left: 22px; }
details li { margin: 6px 0; font-size: 17px; }
details .svc { color: var(--muted); font-weight: 700; }
#results { margin-top: 18px; display: grid; gap: 10px; }
#results.accounts { grid-template-columns: 1fr 1fr; }
.acct, .lead, .mail, .brief {
  background: #fff; border-radius: 18px; box-shadow: var(--shadow); text-align: left;
}
.acct {
  width: 100%; border: 1px solid transparent; display: grid;
  grid-template-columns: 48px 1fr auto; gap: 12px; align-items: center;
  padding: 8px 14px;
}
.acct:hover, .acct:focus-visible { border-color: var(--accent); }
.rank { font-size: 22px; font-weight: 750; color: var(--muted); }
.acct b { display: block; font-size: 24px; letter-spacing: -.02em; }
.acct small, .meta { display: block; color: var(--muted); font-size: 16px; margin-top: 2px; }
.fit { font-size: 34px; font-weight: 750; letter-spacing: -.04em; color: var(--accent); text-align: right; }
.fit span { display: block; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.brief { padding: 22px 24px; }
.brief h2 { font-size: 36px; letter-spacing: -.04em; margin-bottom: 6px; }
.grid4 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
.grid4 article { background: var(--bg); border-radius: 16px; padding: 14px 16px; }
.grid4 h3 { margin: 0 0 8px; font-size: 16px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.grid4 li { margin: 6px 0; }
.person { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.role { color: var(--accent); font-weight: 700; font-size: 16px; }
.counts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.counts div, .bands div { background: #fff; border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
.counts b, .bands b { display: block; font-size: 40px; letter-spacing: -.04em; line-height: 1; }
.counts span, .bands span { color: var(--muted); font-size: 16px; }
.bands { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.hot b { color: var(--hot); } .warm b { color: var(--warm); } .cold b { color: var(--cold); }
.lead, .mail { padding: 14px 16px; border-left: 8px solid var(--line); }
.lead.hot, .pill.hot { border-color: var(--hot); }
.lead.warm { border-color: var(--warm); }
.lead.cold { border-color: var(--cold); }
.lead b, .mail b { font-size: 22px; }
.drop {
  border: 2px dashed var(--accent); border-radius: 22px; background: #fff;
  min-height: 180px; display: grid; place-items: center; text-align: center; padding: 24px;
  font-size: 24px; font-weight: 650;
}
.drop.over { background: var(--accent-soft); }
.drop .filebtn, .ghost {
  margin-top: 12px; background: var(--bg); color: var(--ink); border: 1px solid var(--line);
}
.mail pre { white-space: pre-wrap; font: 18px/1.45 ui-sans-serif, system-ui, sans-serif; margin: 10px 0 0; }
.downloads { display: flex; gap: 12px; flex-wrap: wrap; }
.dl { text-decoration: none; font-size: 22px; padding: 16px 22px; display: inline-block; }
footer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  background: rgba(243, 242, 239, .96); border-top: 1px solid var(--line);
  padding: 12px 28px 14px;
}
#bar { display: flex; gap: 10px; width: min(1180px, 100%); margin: 0 auto; }
#ask {
  flex: 1; border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px;
  background: #fff; font-size: 20px;
}
#next { min-width: 240px; font-size: 20px; }
#hint, #mode { width: min(1180px, 100%); margin: 6px auto 0; color: var(--muted); font-size: 16px; }
.banner { background: #f8f1e4; color: #6a4510; border-radius: 14px; padding: 10px 14px; font-weight: 650; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.rise { animation: rise .28s ease both; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (max-width: 800px) {
  .split, .grid4, .counts, .bands, #results.accounts { grid-template-columns: 1fr; }
  .did { font-size: 24px; }
  header { padding: 12px 14px; }
  #bar { flex-direction: column; }
  #next { min-width: 0; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><i></i>__BRAND__</a>
  <p class="product">Lead generation</p>
  <ol class="steps" id="steps"></ol>
  <button id="replay" type="button">Replay</button>
</header>
<main>
  <div id="banner"></div>
  <div class="split">
    <section class="you"><p class="kicker">You did</p><p class="did" id="you">Ready when you are.</p></section>
    <section class="agent"><p class="kicker">Agent did</p><p class="did" id="agent" aria-live="polite">Press Next, or press Enter in the ask box.</p></section>
  </div>
  <p class="why" id="whyline" hidden></p>
  <details id="trace" hidden><summary>Backend trace</summary><ol id="tracelist"></ol></details>
  <div id="results"></div>
</main>
<footer>
  <form id="bar">
    <label class="sr" for="ask">Ask</label>
    <input id="ask" autocomplete="off" value="Find 20 APAC manufacturing companies expanding plants this quarter">
    <button id="next" type="submit">Next</button>
  </form>
  <p id="hint">Next runs the hunt.</p>
  <p id="mode">Rules mode. No key needed.</p>
</footer>
<script>
const ASK = 'Find 20 APAC manufacturing companies expanding plants this quarter';
const STEP_NAMES = ['Hunt', 'Account', 'Event leads', 'Follow-up', 'Report'];
const askEl = document.getElementById('ask');
const nextEl = document.getElementById('next');
const youEl = document.getElementById('you');
const agentEl = document.getElementById('agent');
const whyEl = document.getElementById('whyline');
const traceEl = document.getElementById('trace');
const traceList = document.getElementById('tracelist');
const results = document.getElementById('results');
const modeEl = document.getElementById('mode');
const banner = document.getElementById('banner');
const replayBtn = document.getElementById('replay');
let step = 1;
let replayOn = false;
let pack = null;
let busy = false;
let huntData = null;
let accountData = null;
let badgeData = null;
let followData = null;
let approveData = null;
let selectedId = null;
let droppedCsv = '';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function pause(ms) { return new Promise(r => setTimeout(r, ms)); }

function slice(all, url) {
  if (url.indexOf('/hunt') >= 0) return all.hunt;
  if (url.indexOf('/badges') >= 0) return all.badges;
  if (url.indexOf('/followup') >= 0) return all.followup;
  if (url.indexOf('/approve') >= 0) return all.approve;
  if (url.indexOf('/account/') >= 0) return (all.briefs || {})[url.split('/').pop()] || null;
  return all;
}
async function ensurePack() {
  if (pack) return pack;
  const r = await fetch('/api/webinar/replay');
  if (!r.ok) throw new Error('replay');
  pack = await r.json();
  return pack;
}
function markReplay() {
  replayOn = true;
  replayBtn.classList.add('on');
  replayBtn.textContent = 'Replay on';
  banner.innerHTML = '<p class="banner">Replay is on. This is the recorded run, so the room still sees the full story.</p>';
}
async function call(url, body) {
  if (replayOn) return slice(await ensurePack(), url);
  try {
    const r = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body || {}) });
    const data = await r.json();
    if (!r.ok || data.fallback) {
      markReplay();
      if (data && data.replay) pack = data.replay;
      return slice(await ensurePack(), url);
    }
    return data;
  } catch (e) {
    markReplay();
    return slice(await ensurePack(), url);
  }
}
async function loadAccount(id) {
  selectedId = id;
  if (replayOn) {
    accountData = slice(await ensurePack(), '/api/webinar/account/' + id);
    return;
  }
  try {
    const r = await fetch('/api/webinar/account/' + id);
    if (!r.ok) throw new Error('account');
    accountData = await r.json();
  } catch (e) {
    markReplay();
    accountData = slice(await ensurePack(), '/api/webinar/account/' + id);
  }
}

function paint(data) {
  youEl.textContent = (data && data.you) || 'Ready when you are.';
  agentEl.textContent = (data && data.agent) || 'Press Next, or press Enter in the ask box.';
  if (data && data.why) {
    whyEl.hidden = false;
    whyEl.innerHTML = '<b>Why. </b>' + esc(data.why) + '<span class="src">Source: ' + esc(data.source || '') + '</span>';
  } else whyEl.hidden = true;
  const lines = (data && data.trace) || [];
  traceEl.hidden = !lines.length;
  traceList.innerHTML = lines.map(t => '<li class="rise"><span class="svc">' + esc(t.at) + ' · ' + esc(t.service) + '.</span> ' + esc(t.line) + '</li>').join('');
  if (data && data.ai) modeEl.textContent = (replayOn ? 'Replay. ' : '') + data.ai;
  else modeEl.textContent = replayOn ? 'Replay. Recorded run. No key needed.' : 'Rules mode. No key needed.';
}

function hintText() {
  if (step === 1) return huntData ? 'Next opens the top account.' : 'Next runs the hunt.';
  if (step === 2) return 'Next cleans the badge scan.';
  if (step === 3) return badgeData ? 'Next drafts the follow-up.' : 'Next uses the sample file.';
  if (step === 4) return approveData ? 'Next opens the report.' : 'Next approves the drafts. Mail stays in this process.';
  return 'Next runs the story again.';
}

function renderSteps() {
  const ol = document.getElementById('steps');
  ol.innerHTML = STEP_NAMES.map((name, i) => {
    const n = i + 1;
    const current = n === step ? ' aria-current="step"' : '';
    const disabled = n > reached() ? ' disabled' : '';
    return '<li><button type="button" data-step="' + n + '"' + current + disabled + '>' + n + ' ' + name + '</button></li>';
  }).join('');
  ol.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
    const n = Number(btn.dataset.step);
    if (n <= reached()) { step = n; render(); }
  }));
}
function reached() {
  let n = 1;
  if (huntData) n = 2;
  if (accountData) n = 3;
  if (badgeData) n = 4;
  if (followData) n = 5;
  if (approveData) n = 5;
  return Math.max(n, step);
}

function render() {
  renderSteps();
  nextEl.textContent = 'Next';
  document.getElementById('hint').textContent = hintText();
  results.className = '';
  results.innerHTML = '';
  if (step === 1) renderHunt();
  else if (step === 2) renderBrief();
  else if (step === 3) renderBadges();
  else if (step === 4) renderFollow();
  else renderReport();
}
function renderHunt() {
  paint(huntData || { you: 'The ask is in the box.', agent: 'Press Next and I will rank 20 fictional APAC manufacturers that are expanding a plant this quarter.' });
  if (!huntData) return;
  results.className = 'accounts';
  results.innerHTML = huntData.accounts.map((a, i) =>
    '<button type="button" class="acct rise" style="animation-delay:' + (i * 28) + 'ms" data-id="' + esc(a.id) + '">' +
    '<span class="rank">' + a.rank + '</span><span><b>' + esc(a.name) + '</b>' +
    '<small>' + esc(a.city) + ', ' + esc(a.country) + ' · ' + esc(a.sector) + '</small>' +
    '<small>' + esc(a.signal) + ' Source: ' + esc(a.source) + '</small></span>' +
    '<span class="fit">' + a.fit + '<span>fit</span></span></button>').join('');
  results.querySelectorAll('.acct').forEach(btn => btn.addEventListener('click', async () => {
    if (busy) return;
    busy = true;
    try {
      await loadAccount(btn.dataset.id);
      step = 2;
      render();
    } finally { busy = false; }
  }));
}
function renderBrief() {
  const a = accountData;
  paint(a || { you: 'Pick an account from the hunt.', agent: 'The brief opens when you do.' });
  if (!a) return;
  const people = (a.committee || []).map(p => '<div class="person"><span><b>' + esc(p.name) + '</b><small class="meta">' + esc(p.title) + '</small></span><span class="role">' + esc(p.role) + '</span></div>').join('');
  const decisions = (a.decisions || []).map(d => '<li><b>' + esc(d.decision) + '.</b> ' + esc(d.why) + ' <span class="meta">Source: ' + esc(d.source) + '</span></li>').join('');
  results.innerHTML = '<article class="brief rise"><p class="kicker">Fit ' + esc(a.fit) + ' · ' + esc(a.city) + ', ' + esc(a.country) + '</p><h2>' + esc(a.name) + '</h2><p>' + esc(a.signal) + '</p>' +
    '<div class="grid4"><article><h3>Priorities</h3><ul>' + (a.priorities || []).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></article>' +
    '<article><h3>Buying committee</h3>' + people + '</article>' +
    '<article><h3>Recommended angle</h3><p>' + esc(a.angle) + '</p></article>' +
    '<article><h3>Talking points</h3><ul>' + (a.talkingPoints || []).map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></article></div>' +
    '<ol>' + decisions + '</ol></article>';
}
function renderBadges() {
  paint(badgeData || { you: 'The badge scan is messy on purpose.', agent: 'Drop a file, or press Next and I will use the sample: duplicates, bad casing, missing fields, and junk rows.' });
  if (!badgeData) {
    results.innerHTML = '<div class="drop" id="drop">Drop the badge scan here<button type="button" class="filebtn" id="sample">Use sample file</button><input id="file" class="sr" type="file" accept=".csv,text/csv"></div><p class="meta"><a href="/api/webinar/sample.csv">Download the messy sample</a></p>';
    const drop = document.getElementById('drop');
    drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', e => { e.preventDefault(); takeFile(e.dataTransfer.files[0]); });
    document.getElementById('file').addEventListener('change', e => takeFile(e.target.files[0]));
    document.getElementById('sample').addEventListener('click', () => runBadges(''));
    drop.addEventListener('click', e => { if (e.target.id !== 'sample') document.getElementById('file').click(); });
    return;
  }
  const b = badgeData;
  const junk = (b.junkSummary || []).map(j => esc(j.n + ' ' + j.kind.toLowerCase())).join(', ');
  const leads = (b.leads || []).map(l => '<article class="lead ' + esc(l.band) + '"><b>' + esc(l.name) + '</b> · ' + esc(l.band) + '<small class="meta">' + esc(l.title) + ' · ' + esc(l.company) + (l.email ? ' · ' + esc(l.email) : '') + '</small><p>' + esc(l.reason) + '</p><small class="meta">Source: ' + esc(l.source) + '</small></article>').join('');
  results.innerHTML = '<div class="counts"><div><b>' + b.read + '</b><span>rows read</span></div><div><b>' + b.dropped + '</b><span>junk dropped' + (junk ? ' · ' + junk : '') + '</span></div><div><b>' + b.merged + '</b><span>repeat scans merged</span></div><div><b>' + b.before + ' → ' + b.after + '</b><span>CRM before → after</span></div></div>' +
    '<div class="bands"><div class="hot"><b>' + b.bands.hot + '</b><span>hot</span></div><div class="warm"><b>' + b.bands.warm + '</b><span>warm</span></div><div class="cold"><b>' + b.bands.cold + '</b><span>cold</span></div></div>' + leads;
}
function renderFollow() {
  const data = approveData || followData;
  paint(data || { you: 'Hot leads are ready for a note.', agent: 'Press Next and I will draft one email per hot lead, with a meeting slot.' });
  const drafts = (followData && followData.drafts) || [];
  results.innerHTML = drafts.map(d => '<article class="mail"><b>' + esc(d.name) + '</b><small class="meta">' + esc(d.to) + ' · ' + esc(d.slot) + '</small><p>' + esc(d.subject) + '</p><pre>' + esc(d.body) + '</pre><small class="meta">Why: ' + esc(d.why) + ' Source: ' + esc(d.source) + '</small></article>').join('');
  if (approveData) results.insertAdjacentHTML('afterbegin', '<article class="brief"><h2>Caught here: ' + esc(approveData.caught) + '</h2><p>Sent to real inboxes: ' + esc(approveData.realSent) + '.</p></article>');
}
function renderReport() {
  const bands = (badgeData && badgeData.bands) || { hot: 0, warm: 0, cold: 0 };
  const caught = approveData ? approveData.caught : 0;
  const realSent = approveData ? approveData.realSent : 0;
  paint({
    you: 'You asked for the pipeline summary.',
    agent: 'The PowerPoint and the PDF use the same counts as this screen.',
    why: 'The deck is the leave-behind: 20 accounts, the badge cleanup, the hot notes, and zero messages to real inboxes.',
    source: 'This webinar run.',
    trace: [
      { at: '0.2s', service: 'Report', line: 'Counted 20 accounts and the badge scores.' },
      { at: '0.5s', service: 'Report', line: 'Wrote the PowerPoint and the PDF. Real inboxes stay at ' + realSent + '.' }
    ],
    ai: (approveData && approveData.ai) || (badgeData && badgeData.ai) || ''
  });
  const before = badgeData ? badgeData.before : 0;
  const after = badgeData ? badgeData.after : 0;
  results.innerHTML = '<div class="counts"><div><b>20</b><span>accounts ranked</span></div><div><b>' + before + ' → ' + after + '</b><span>CRM before → after</span></div><div><b>' + bands.hot + '</b><span>hot notes</span></div><div><b>' + realSent + '</b><span>sent to real inboxes · ' + caught + ' caught here</span></div></div>' +
    '<div class="downloads"><a class="dl" id="pptx" href="/api/webinar/report.pptx">Download PowerPoint</a><a class="dl" id="pdf" href="/api/webinar/report.pdf">Download PDF</a></div>';
}

async function runBadges(csv) {
  if (busy) return;
  busy = true;
  nextEl.disabled = true;
  try {
    await pause(220);
    badgeData = await call('/api/webinar/badges', { csv: csv || '', replay: replayOn });
    render();
  } finally { busy = false; nextEl.disabled = false; }
}
function takeFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { droppedCsv = String(reader.result || ''); runBadges(droppedCsv); };
  reader.readAsText(file);
}

async function go(e) {
  if (e) e.preventDefault();
  if (busy) return;
  busy = true;
  nextEl.disabled = true;
  try {
    await pause(220);
    const ask = askEl.value.trim() || ASK;
    if (step === 1 && (!huntData || (huntData.ask && ask !== huntData.ask && !replayOn))) {
      huntData = await call('/api/webinar/hunt', { ask, replay: replayOn });
    } else if (step === 1) {
      step = 2;
      if (!selectedId && huntData && huntData.accounts[0]) selectedId = huntData.accounts[0].id;
      if (selectedId) await loadAccount(selectedId);
    } else if (step === 2) {
      step = 3;
    } else if (step === 3 && !badgeData) {
      badgeData = await call('/api/webinar/badges', { csv: droppedCsv || '', replay: replayOn });
    } else if (step === 3) {
      step = 4;
      followData = await call('/api/webinar/followup', { replay: replayOn });
    } else if (step === 4 && !followData) {
      followData = await call('/api/webinar/followup', { replay: replayOn });
    } else if (step === 4 && !approveData) {
      approveData = await call('/api/webinar/approve', { replay: replayOn });
    } else if (step === 4) {
      step = 5;
    } else {
      await fetch('/api/webinar/reset', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }).catch(() => {});
      huntData = accountData = badgeData = followData = approveData = null;
      selectedId = null;
      droppedCsv = '';
      step = 1;
      askEl.value = ASK;
    }
    render();
  } catch (err) {
    agentEl.textContent = 'That step did not finish. Press Next to try the recorded run.';
    markReplay();
  } finally {
    busy = false;
    nextEl.disabled = false;
  }
}

document.getElementById('bar').addEventListener('submit', go);
replayBtn.addEventListener('click', async () => {
  if (busy) return;
  try {
    await ensurePack();
    markReplay();
    huntData = accountData = badgeData = followData = approveData = null;
    selectedId = null;
    droppedCsv = '';
    step = 1;
    askEl.value = ASK;
    render();
  } catch (e) {
    agentEl.textContent = 'Replay did not load. Press Next to try again.';
  }
});
render();
</script>
</body>
</html>
